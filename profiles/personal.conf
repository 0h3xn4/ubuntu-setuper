# profiles/personal.conf — personal machine: core + everyday desktop apps + embedded tooling
#
# Decided by the user: embedded tooling is part of the personal profile too (side projects,
# flight-software work at home). To leave it out, change the line below to
#   PROFILE_MODULES=(desktop)
# or copy this file to profiles/<yourname>.conf and edit that.
PROFILE_DESCRIPTION="Personal: core development setup + everyday desktop apps + embedded tooling"
PROFILE_MODULES=(embedded desktop)
