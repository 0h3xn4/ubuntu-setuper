# =============================================================================
#  workstation.conf — CORE settings for setup.sh
#
#  The core is always installed, on every profile. Optional parts live in
#  modules (modules/<name>/module.conf); profiles (profiles/<name>.conf)
#  choose which modules a machine gets.
#
#  Edit this file to adapt the workstation to your team, and keep it in
#  version control next to setup.sh.
#
#  - Switches (1 = on, 0 = off) can also be overridden from the environment
#    for a single run, e.g.:   INSTALL_DOCKER=1 ./setup.sh --profile work
#  - A profile may preset switches too. Order of precedence:
#        environment  >  profile  >  this file  >  module defaults
#  - WHAT gets installed is defined here and in the modules; WHICH VERSION is
#    pinned in locks/<profile>.lock (generated with ./setup.sh --lock).
#  - After editing, preview the effect with:   ./setup.sh --check
#
#  Two policies are fixed and have NO switch, on any profile:
#    no cloud (nothing contacts external services after installation) and
#    don't break Ubuntu (see README.md).
# =============================================================================

# ----------------------------------------------------------------------------
# Ubuntu releases
# ----------------------------------------------------------------------------
# The LTS releases this setup is VERIFIED on: every package name checked against that release's real
# archive, and a full end-to-end run (tools/e2e.sh) in CI. You do NOT have to upgrade to the newest
# LTS: any release listed here is supported. Add a release only after both checks are green.
: "${SUPPORTED_UBUNTU:=24.04 26.04}"
# Packages that are a separate package only from a given release on (older releases ship the same
# function inside another package). They are skipped on older releases, with a note instead of a warning.
declare -gA PKG_SINCE=( [qemu-system-riscv]=26.04 )
declare -gA PKG_SINCE_NOTE=( [qemu-system-riscv]="RISC-V emulation is part of qemu-system-misc on this release" )

# ----------------------------------------------------------------------------
# Changes to the Ubuntu system and to your login files: ALL OFF BY DEFAULT
#
# By default the setup installs packages and writes new files in your home
# directory. It does not touch the system itself. Each change below has its
# own switch; turn on only what you want (here, in a profile, or for one run:
# TUNE_INOTIFY=1 ./setup.sh). './setup.sh --explain' lists what is on and off.
# ----------------------------------------------------------------------------
: "${TUNE_INOTIFY:=0}"                    # NEW file /etc/sysctl.d/60-dev-inotify.conf: more file watches for language servers
: "${DISABLE_REPORTING_SERVICES:=0}"      # disable apport, whoopsie, kerneloops (crash/problem reports)
: "${DISABLE_MOTD_NEWS:=0}"               # disable motd-news.timer (news fetched at login)
: "${DISABLE_FWUPD_REFRESH:=0}"           # disable fwupd-refresh.timer (firmware metadata refresh)
: "${DISABLE_APT_NEWS:=0}"                # 'pro config set apt_news=false' (messages fetched by apt)
: "${DISABLE_NM_CONNECTIVITY_CHECK:=0}"   # NEW file /etc/NetworkManager/conf.d/99-no-connectivity-check.conf
: "${SET_GNOME_FONT:=0}"                  # GNOME monospace font: JetBrains Mono 11
: "${SET_GNOME_PRIVACY:=0}"               # GNOME: no location, no automatic time zone, no problem reports, no usage stats, no web search
: "${JOIN_DOCKER_GROUP:=0}"               # with INSTALL_DOCKER: add your user to group 'docker' (equivalent to root)
: "${ENABLE_SHELL_LOADER:=0}"             # append ONE marked block to ~/.bashrc that loads ~/.bashrc.d (aliases, PATH, prompt, offline lock)
: "${SET_GIT_DEFAULTS:=0}"                # global git defaults (only options you have not set yourself)
: "${INSTALL_OH_MY_BASH:=0}"              # Oh My Bash (themes, plugins) from a pinned clone, loaded from ~/.bashrc.d; replaces the starship prompt

# ----------------------------------------------------------------------------
# Feature switches (core)
# ----------------------------------------------------------------------------
: "${INSTALL_CPP:=1}"               # C/C++ toolchain, analyzers, test frameworks
: "${INSTALL_PYTHON:=1}"            # uv + Python dev tools (ruff, basedpyright, pre-commit)
: "${INSTALL_RUST:=1}"              # rustup + stable toolchain
: "${INSTALL_CARGO_TOOLS:=1}"       # cargo tools below (compiles; slow)
: "${INSTALL_BASH_LSP:=1}"          # Bash language server (via npm; offline at runtime)
: "${INSTALL_HELIX:=1}"             # Helix editor + configuration
: "${INSTALL_PODMAN:=1}"            # Podman + Distrobox
: "${INSTALL_DOCKER:=0}"            # Docker Engine. Off by default: Docker rewrites
                                    # firewall rules, which can interfere with VPNs.
: "${INSTALL_STARSHIP:=1}"          # Starship prompt (not started while Oh My Bash is enabled)
: "${INSTALL_KATE:=1}"              # Kate (KDE text editor, a GUI): deb from the archive; pulls in KDE libraries
: "${INSTALL_NICE_TO_HAVE:=1}"      # extra terminal tools (zellij, difftastic); skipped if the archive lacks them
: "${INSTALL_NERD_FONT:=1}"         # JetBrains Mono Nerd Font in ~/.local/share/fonts (needed for icons in prompts)
: "${INSTALL_GUI_TOOLS:=1}"         # Meld (visual diff/merge)
: "${INSTALL_OFFLINE_DOCS:=1}"      # Local C/C++, Python, CMake, POSIX, glibc, Rust docs
: "${ALLOW_CURL_INSTALLERS:=1}"     # Allow official installers when a tool isn't in the
                                    # Ubuntu archive (uv, rustup, starship, Helix).
                                    # Downloads are checksum-recorded. Check IT policy.
: "${FORCE_CONFIG:=0}"              # Overwrite existing config files (backups are kept)
: "${GIT_NAME:=}"                   # Sets git user.name if not already configured
: "${GIT_EMAIL:=}"                  # Sets git user.email if not already configured

# ----------------------------------------------------------------------------
# Offline caches (filled during installation, used offline afterwards)
# Modules add their own packages/crates to these caches.
# ----------------------------------------------------------------------------
: "${ENFORCE_OFFLINE_ENV:=1}"       # Make uv/pip/cargo work only from local caches
: "${CACHE_PYTHON:=1}"              # Download wheels into a local wheelhouse
: "${CACHE_RUST:=1}"                # Pre-fetch common crates into the cargo cache
: "${CACHE_CONTAINER_IMAGES:=1}"    # Pre-pull container images

# Python packages available offline: uv pip install <name>
: "${OFFLINE_PY_PACKAGES:=pytest pytest-cov hypothesis numpy scipy matplotlib pandas pyyaml jsonschema lxml jinja2 ipython rich}"

# Rust crates available offline: cargo add <name>
: "${OFFLINE_RUST_CRATES:=bitflags crc serde thiserror anyhow clap proptest}"

# Container images available offline (legacy build environments, etc.)
# ubuntu:latest always points to the newest Ubuntu LTS release. Add older or
# other images only as deliberate exceptions (e.g. a project's legacy build
# environment), and pin them with --lock.
: "${OFFLINE_CONTAINER_IMAGES:=docker.io/library/ubuntu:latest}"

# ----------------------------------------------------------------------------
# Versions
#
# Rule: always the newest stable release; for software with an LTS line, the
# newest LTS. Never betas, release candidates or nightlies. Empty means
# "newest stable, resolved at install time". locks/<profile>.lock pins exact
# versions; ./setup.sh --upgrade ignores the pins to move forward.
# ----------------------------------------------------------------------------
: "${RUST_TOOLCHAIN:=stable}"       # Rust has no LTS; 'stable' is its newest stable release
: "${HELIX_VERSION:=}"              # used only if Helix isn't in the Ubuntu archive
: "${UV_VERSION:=}"                 # used only if uv isn't in the Ubuntu archive
: "${NODE_LTS_VERSION:=}"           # empty = the newest Node.js LTS from nodejs.org, resolved at install time (e.g. v26.13.0)
: "${NODE_FROM_ARCHIVE:=0}"         # 1 = use Ubuntu's own (older) nodejs/npm instead of the newest upstream LTS
: "${NERD_FONT_VERSION:=}"          # Nerd Fonts release tag; empty = newest stable (pinned by the lock)
: "${OH_MY_BASH_COMMIT:=}"          # Oh My Bash commit (it has no stable releases); empty = current HEAD (pinned by the lock)

# ----------------------------------------------------------------------------
# APT package lists. Missing packages are skipped and reported, never fatal.
# Add your team's own packages to PKGS_EXTRA.
# ----------------------------------------------------------------------------
PKGS_BASE=(
  git git-lfs wget unzip zip 7zip xz-utils zstd rsync tree file
  distro-info
  htop btop jq yq ripgrep fd-find bat eza zoxide fzf direnv tealdeer
  hyperfine entr just tmux bash-completion shellcheck shfmt yamllint
  git-delta lazygit moreutils pv ncdu libxml2-utils
  fonts-jetbrains-mono
  wl-clipboard xclip              # system clipboard for Helix (Space y / Space p): Wayland / X11
)
# Deliberately NOT included: gh/glab (they talk to cloud forges).

PKGS_CPP=(
  build-essential cmake cmake-curses-gui ninja-build meson pkg-config
  ccache mold gdb
  clang clangd clang-format clang-tidy clang-tools lld llvm lldb
  valgrind cppcheck iwyu bear lcov gcovr
  strace ltrace linux-tools-common linux-tools-generic
  libgtest-dev libgmock-dev cpputest catch2
  doxygen graphviz pandoc
)

PKGS_GUI=(meld)
PKGS_KATE=(kate)
PKGS_NICE_TO_HAVE=(zellij difftastic)   # easier tmux alternative; structural diff (not in every release)
PKGS_DOCS=(
  cppreference-doc-en-html python3-doc cmake-doc
  manpages-dev manpages-posix manpages-posix-dev glibc-doc gdb-doc
)
PKGS_PYTHON=(python3-dev python3-venv)
PKGS_RUST_BUILD=(libssl-dev pkg-config)               # needed to compile some cargo tools
PKGS_NODE=(nodejs npm)
PKGS_PODMAN=(podman distrobox)
PKGS_DOCKER=(docker.io docker-compose-v2 docker-buildx)
PKGS_EXTRA=()

# ----------------------------------------------------------------------------
# Tools installed outside APT (versions pinned in locks/<profile>.lock)
# Modules append their own tools.
# ----------------------------------------------------------------------------
UV_TOOLS=(ruff basedpyright pre-commit pre-commit-hooks cmake-language-server)
CARGO_TOOLS=(taplo-cli cargo-nextest)
NPM_TOOLS=(bash-language-server)
RUST_COMPONENTS=(rust-analyzer rust-src llvm-tools rust-docs)
RUST_TARGETS=()                     # extra targets (host is always present); modules add theirs
