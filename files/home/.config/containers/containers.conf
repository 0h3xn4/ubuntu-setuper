# ~/.config/containers/containers.conf — installed by workstation-setup
#
# Never pull container images implicitly (e.g. when 'podman run' or
# 'distrobox create' refers to an image that isn't present locally).
# Images are pulled once during installation; see workstation.conf.
# An explicit 'podman pull' still works if you deliberately need one.
[engine]
pull_policy = "never"
