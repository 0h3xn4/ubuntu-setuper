# =============================================================================
#  modules/desktop/module.conf — settings of the "desktop" module
#
#  Everyday desktop applications for personal machines. Rules:
#    - Debs from the Ubuntu archive only. No snaps, no Flatpak/Flathub (online
#      stores with background refresh).
#    - Every app gets its background network features switched off, with new
#      files only (never by editing package-owned files), and each setting is
#      checked by the self-test.
#
#  "No cloud" for apps that are networked by nature (browser, mail): traffic
#  the user directs to a destination the user chose is fine (opening a
#  website, fetching mail from your own server, an explicit 'podman pull').
#  Anything automatic or in the background is not: telemetry, update checks,
#  crash reports, sync, accounts, recommendations, automatic lookups (album
#  art, website icons, metadata), implicit downloads.
#
#  Sourced by setup.sh when a profile lists "desktop" in PROFILE_MODULES.
#  Switches can be overridden by the environment or by a profile.
# =============================================================================

: "${DESKTOP_LIBREOFFICE:=1}"       # LibreOffice (usually preinstalled); online update check off
: "${DESKTOP_KEEPASSXC:=1}"         # KeePassXC offline password manager; update check and icon downloads off
: "${DESKTOP_VLC:=1}"               # VLC media player; metadata/album-art network access off
: "${DESKTOP_GIMP:=1}"              # GIMP + offline help; update check off
: "${DESKTOP_INKSCAPE:=1}"          # Inkscape
: "${DESKTOP_DEJADUP:=1}"           # Déjà Dup backups, restricted to local/external disks
: "${DESKTOP_BROWSER_POLICIES:=1}"  # Enterprise policy files for Firefox and Thunderbird (never overwrites)

# Languages for spell-check dictionaries, LibreOffice language packs and
# help. Space-separated ISO codes, e.g. "de fr". Empty = nothing extra
# (English comes with the system). Resolved offline with
# 'check-language-support', so only packages of the Ubuntu archive are used.
: "${DESKTOP_LANGUAGES:=}"

PKGS_DESKTOP_LIBREOFFICE=(
  libreoffice-writer libreoffice-calc libreoffice-impress libreoffice-draw
  libreoffice-math libreoffice-gnome libreoffice-help-en-us
)
PKGS_DESKTOP_KEEPASSXC=(keepassxc)
PKGS_DESKTOP_VLC=(vlc)
PKGS_DESKTOP_GIMP=(gimp gimp-help-en)
PKGS_DESKTOP_INKSCAPE=(inkscape)
PKGS_DESKTOP_DEJADUP=(deja-dup)
