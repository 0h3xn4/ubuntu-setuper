# =============================================================================
#  modules/embedded/module.conf — settings of the "embedded" module
#
#  Embedded and flight-software tooling: ARM and RISC-V cross compilers, QEMU,
#  debug probes, serial and CAN tools, packet inspection, verification tools,
#  optional SPICE kernels, cross-build starter files.
#
#  Sourced by setup.sh when a profile lists "embedded" in PROFILE_MODULES.
#  Switches can be overridden by the environment or by a profile.
# =============================================================================

: "${JOIN_SERIAL_GROUPS:=0}"        # SYSTEM CHANGE (off by default): add your user to groups dialout, plugdev (serial ports, debug probes without sudo)
: "${JOIN_WIRESHARK_GROUP:=0}"      # SYSTEM CHANGE (off by default): allow non-root capture (debconf answer, group wireshark)
: "${PROBE_RS_PREBUILT:=1}"        # probe-rs from the project's release (checksum-verified) instead of compiling it (10+ min)
: "${PROBE_RS_VERSION:=}"           # release tag, e.g. v0.32.0; empty = newest (pinned by the lock)
: "${INSTALL_WIRESHARK:=1}"         # Wireshark (packet/telemetry inspection), non-root capture
: "${INSTALL_VERIFICATION:=1}"      # CBMC, flawfinder, AFL++, lizard, codespell
: "${INSTALL_FRAMA_C:=0}"           # Frama-C (large; formal analysis of C); needs INSTALL_VERIFICATION=1
: "${INSTALL_FPRIME_BOOTSTRAP:=0}"  # NASA F Prime project bootstrapper
: "${INSTALL_SPICE_KERNELS:=0}"     # Download NAIF generic SPICE kernels (~35 MB)

PKGS_EMBEDDED=(
  gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
  libstdc++-arm-none-eabi-newlib
  gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf
  gdb-multiarch
  openocd stlink-tools dfu-util srecord
  can-utils sigrok-cli
  qemu-system-arm qemu-system-misc qemu-system-riscv qemu-system-sparc qemu-user qemu-user-binfmt qemu-utils
  tio picocom minicom
  libudev-dev                       # needed to compile probe-rs
)
PKGS_EMBEDDED_GUI=(pulseview)       # logic analyzer; installed when INSTALL_GUI_TOOLS=1
PKGS_WIRESHARK=(wireshark)
PKGS_VERIFICATION=(cbmc flawfinder afl++)
PKGS_FRAMA_C=(frama-c)

# Added to the core tool lists (see workstation.conf)
EMBEDDED_UV_TOOLS_VERIFICATION=(lizard codespell)
EMBEDDED_CARGO_TOOLS=(cargo-binutils flip-link probe-rs-tools)
# Bare-metal targets: Cortex-M0/M0+, Cortex-M3, Cortex-M4F/M7F, RISC-V 32
EMBEDDED_RUST_TARGETS=(thumbv6m-none-eabi thumbv7m-none-eabi thumbv7em-none-eabihf riscv32imac-unknown-none-elf)
# Added to the offline caches (see workstation.conf)
EMBEDDED_PY_PACKAGES=(pyserial python-can spacepackets crc)
EMBEDDED_RUST_CRATES=(heapless cortex-m cortex-m-rt embedded-hal nb critical-section defmt defmt-rtt panic-halt panic-probe postcard)
